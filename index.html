<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>For You — A Little Book of Beautiful Things</title>

    <!-- ============================================
    GOOGLE FONTS
    ============================================ -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&family=Dancing+Script:wght@400;500;600;700&display=swap" rel="stylesheet" />

    <style>
        /* ============================================
           GLOBAL RESET & BASE
           ============================================ */
        *,
        *::before,
        *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --book-width: min(340px, 92vw);
            --book-height: min(480px, 72vh);
            --spine-width: 3px;
            --page-half: calc(var(--book-width) / 2);
            --warm-light: #f5e6c8;
            --desk-dark: #2a1d12;
            --paper-cream: #f8f0e0;
            --ink-dark: #3b2a1a;
            --leather-dark: #1a120e;
            --gold-emboss: #c9a94e;
            --shadow-deep: rgba(0, 0, 0, 0.65);
            --shadow-mid: rgba(0, 0, 0, 0.45);
            --shadow-light: rgba(0, 0, 0, 0.25);
            --turn-duration: 0.75s;
            --turn-ease: cubic-bezier(0.32, 0.08, 0.24, 0.96);
        }

        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: 'Caveat', cursive;
            background: #0f0a07;
            -webkit-tap-highlight-color: transparent;
            -webkit-user-select: none;
            user-select: none;
            touch-action: manipulation;
        }

        /* ============================================
           WOODEN DESK BACKGROUND
           ============================================ */
        .desk {
            position: fixed;
            inset: 0;
            z-index: 1;
            background:
                radial-gradient(ellipse at 50% 38%, #5a3d2b 0%, #3d261a 28%, #2a1810 58%, #1a0f09 82%, #0f0a07 100%);
            overflow: hidden;
        }

        .desk::before {
            content: '';
            position: absolute;
            inset: 0;
            background:
                repeating-linear-gradient(2deg,
                    rgba(0, 0, 0, 0.14) 0px,
                    rgba(0, 0, 0, 0.03) 3px,
                    rgba(255, 255, 255, 0.02) 6px,
                    rgba(0, 0, 0, 0.1) 9px,
                    rgba(0, 0, 0, 0.05) 13px,
                    rgba(255, 255, 255, 0.015) 17px,
                    rgba(0, 0, 0, 0.12) 21px,
                    rgba(0, 0, 0, 0.04) 25px);
            pointer-events: none;
            mix-blend-mode: overlay;
        }

        .desk::after {
            content: '';
            position: absolute;
            inset: 0;
            background:
                radial-gradient(ellipse at 50% 30%, rgba(255, 220, 160, 0.08) 0%, transparent 55%),
                radial-gradient(ellipse at 20% 70%, rgba(255, 180, 120, 0.05) 0%, transparent 40%);
            pointer-events: none;
        }

        /* ============================================
           WARM LAMP LIGHT OVERLAY
           ============================================ */
        .lamp-glow {
            position: fixed;
            inset: 0;
            z-index: 2;
            pointer-events: none;
            background:
                radial-gradient(ellipse at 50% 22%, rgba(255, 205, 140, 0.18) 0%, rgba(255, 180, 100, 0.07) 25%, transparent 55%),
                radial-gradient(ellipse at 50% 85%, rgba(255, 190, 130, 0.06) 0%, transparent 40%);
            mix-blend-mode: screen;
        }

        /* ============================================
           VIGNETTE
           ============================================ */
        .vignette {
            position: fixed;
            inset: 0;
            z-index: 3;
            pointer-events: none;
            background: radial-gradient(ellipse at center, transparent 35%, rgba(0, 0, 0, 0.5) 75%, rgba(0, 0, 0, 0.82) 100%);
        }

        /* ============================================
           DUST PARTICLES
           ============================================ */
        .dust-container {
            position: fixed;
            inset: 0;
            z-index: 4;
            pointer-events: none;
            overflow: hidden;
        }

        .dust-particle {
            position: absolute;
            width: 2px;
            height: 2px;
            background: rgba(255, 230, 180, 0.55);
            border-radius: 50%;
            filter: blur(0.5px);
            animation: floatDust 8s infinite ease-in-out;
            opacity: 0;
        }

        .dust-particle:nth-child(1) {
            left: 12%;
            top: 45%;
            animation-delay: 0s;
            animation-duration: 9s;
            width: 1.5px;
            height: 1.5px;
        }
        .dust-particle:nth-child(2) {
            left: 28%;
            top: 35%;
            animation-delay: 1.2s;
            animation-duration: 11s;
            width: 2.5px;
            height: 2.5px;
        }
        .dust-particle:nth-child(3) {
            left: 47%;
            top: 25%;
            animation-delay: 2.4s;
            animation-duration: 7.5s;
            width: 1.8px;
            height: 1.8px;
        }
        .dust-particle:nth-child(4) {
            left: 62%;
            top: 40%;
            animation-delay: 0.8s;
            animation-duration: 10s;
            width: 2px;
            height: 2px;
        }
        .dust-particle:nth-child(5) {
            left: 75%;
            top: 30%;
            animation-delay: 3.2s;
            animation-duration: 8.5s;
            width: 1.6px;
            height: 1.6px;
        }
        .dust-particle:nth-child(6) {
            left: 88%;
            top: 50%;
            animation-delay: 1.8s;
            animation-duration: 12s;
            width: 2.2px;
            height: 2.2px;
        }
        .dust-particle:nth-child(7) {
            left: 18%;
            top: 55%;
            animation-delay: 4s;
            animation-duration: 9.5s;
            width: 1.4px;
            height: 1.4px;
        }
        .dust-particle:nth-child(8) {
            left: 40%;
            top: 50%;
            animation-delay: 2s;
            animation-duration: 13s;
            width: 2.8px;
            height: 2.8px;
        }
        .dust-particle:nth-child(9) {
            left: 55%;
            top: 18%;
            animation-delay: 0.5s;
            animation-duration: 7s;
            width: 1.2px;
            height: 1.2px;
        }
        .dust-particle:nth-child(10) {
            left: 68%;
            top: 48%;
            animation-delay: 3.8s;
            animation-duration: 10.5s;
            width: 2px;
            height: 2px;
        }
        .dust-particle:nth-child(11) {
            left: 32%;
            top: 62%;
            animation-delay: 5s;
            animation-duration: 8s;
            width: 1.7px;
            height: 1.7px;
        }
        .dust-particle:nth-child(12) {
            left: 80%;
            top: 28%;
            animation-delay: 2.6s;
            animation-duration: 9.2s;
            width: 1.9px;
            height: 1.9px;
        }

        @keyframes floatDust {
            0% {
                opacity: 0;
                transform: translateY(0) translateX(0) scale(1);
            }
            15% {
                opacity: 0.7;
            }
            50% {
                opacity: 0.45;
                transform: translateY(-50px) translateX(20px) scale(0.9);
            }
            85% {
                opacity: 0.15;
            }
            100% {
                opacity: 0;
                transform: translateY(-120px) translateX(-15px) scale(0.8);
            }
        }

        /* ============================================
           AUDIO TOGGLE BUTTON
           ============================================ */
        .audio-toggle {
            position: fixed;
            bottom: 16px;
            right: 16px;
            z-index: 100;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: rgba(20, 12, 8, 0.7);
            border: 1px solid rgba(180, 140, 90, 0.4);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
            transition: all 0.3s ease;
            font-size: 18px;
            color: #d4b896;
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
        }
        .audio-toggle:active {
            transform: scale(0.9);
            background: rgba(30, 18, 10, 0.85);
        }
        .audio-toggle .icon {
            pointer-events: none;
            letter-spacing: 0;
            line-height: 1;
        }

        /* ============================================
           BOOK CONTAINER
           ============================================ */
        .book-stage {
            position: fixed;
            inset: 0;
            z-index: 10;
            display: flex;
            align-items: center;
            justify-content: center;
            perspective: 1400px;
            perspective-origin: 50% 40%;
            -webkit-perspective: 1400px;
            -webkit-perspective-origin: 50% 40%;
        }

        /* ============================================
           BOOK WRAPPER (for 3D positioning)
           ============================================ */
        .book-wrapper {
            position: relative;
            width: var(--book-width);
            height: var(--book-height);
            transform-style: preserve-3d;
            -webkit-transform-style: preserve-3d;
            transition: transform 0.6s ease;
        }

        /* ============================================
           BOOK SHADOW ON DESK
           ============================================ */
        .book-desk-shadow {
            position: absolute;
            bottom: -18px;
            left: -8%;
            width: 116%;
            height: 32px;
            background: radial-gradient(ellipse at center, rgba(0, 0, 0, 0.7) 0%, rgba(0, 0, 0, 0.3) 50%, transparent 75%);
            border-radius: 50%;
            z-index: 1;
            pointer-events: none;
            transition: all 0.6s ease;
            filter: blur(6px);
        }

        /* ============================================
           BOOK HARDCOVER (closed state)
           ============================================ */
        .book-cover-closed {
            position: absolute;
            inset: 0;
            z-index: 30;
            transform-style: preserve-3d;
            -webkit-transform-style: preserve-3d;
            transform-origin: left center;
            -webkit-transform-origin: left center;
            cursor: pointer;
            transition: transform 1.2s cubic-bezier(0.25, 0.1, 0.2, 1);
        }

        .book-cover-closed.opening {
            transform: rotateY(-175deg);
            -webkit-transform: rotateY(-175deg);
        }

        .cover-face {
            position: absolute;
            inset: 0;
            backface-visibility: hidden;
            -webkit-backface-visibility: hidden;
            border-radius: 6px 10px 10px 6px;
            overflow: hidden;
        }

        .cover-front {
            background:
                radial-gradient(ellipse at 30% 25%, #2a1e14 0%, #1a100a 40%, #0f0805 75%, #080502 100%);
            border: 1px solid rgba(80, 55, 35, 0.6);
            box-shadow:
                inset 0 0 80px rgba(0, 0, 0, 0.7),
                inset 0 0 30px rgba(0, 0, 0, 0.5),
                6px 8px 30px rgba(0, 0, 0, 0.8),
                0 2px 8px rgba(0, 0, 0, 0.6);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 20px;
            position: relative;
        }

        .cover-front::before {
            content: '';
            position: absolute;
            inset: 0;
            background:
                repeating-linear-gradient(45deg,
                    rgba(0, 0, 0, 0.08) 0px,
                    rgba(0, 0, 0, 0.04) 2px,
                    rgba(255, 255, 255, 0.015) 3px,
                    rgba(0, 0, 0, 0.06) 5px,
                    rgba(255, 255, 255, 0.01) 7px);
            pointer-events: none;
            border-radius: 6px 10px 10px 6px;
        }

        .cover-front::after {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: 6px 10px 10px 6px;
            box-shadow:
                inset 0 0 12px rgba(0, 0, 0, 0.6),
                inset 2px 0 6px rgba(0, 0, 0, 0.4),
                inset -2px 0 6px rgba(0, 0, 0, 0.4);
            pointer-events: none;
        }

        .cover-title {
            font-family: 'Playfair Display', serif;
            font-size: clamp(22px, 6vw, 30px);
            font-weight: 600;
            letter-spacing: 2px;
            color: #d8b96a;
            text-shadow:
                0 1px 2px rgba(0, 0, 0, 0.9),
                0 2px 4px rgba(0, 0, 0, 0.7),
                0 0 20px rgba(200, 160, 60, 0.18);
            position: relative;
            z-index: 1;
            margin-bottom: 6px;
        }

        .cover-subtitle {
            font-family: 'Playfair Display', serif;
            font-size: clamp(10px, 2.5vw, 13px);
            font-weight: 400;
            font-style: italic;
            letter-spacing: 1.5px;
            color: #c4a86a;
            text-shadow: 0 1px 3px rgba(0, 0, 0, 0.8);
            position: relative;
            z-index: 1;
            margin-bottom: 12px;
        }

        .cover-ornament {
            width: 40px;
            height: 1px;
            background: linear-gradient(90deg, transparent, #c9a94e, transparent);
            position: relative;
            z-index: 1;
            margin: 4px 0;
        }

        .cover-small-text {
            font-family: 'Caveat', cursive;
            font-size: clamp(11px, 2.8vw, 14px);
            color: #b8a070;
            text-shadow: 0 1px 2px rgba(0, 0, 0, 0.7);
            position: relative;
            z-index: 1;
        }

        .cover-back {
            background: linear-gradient(135deg, #e8dfcd 0%, #d5c9af 30%, #c8b998 70%, #baa884 100%);
            border: 1px solid rgba(150, 125, 90, 0.4);
            box-shadow: inset 0 0 40px rgba(0, 0, 0, 0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            transform: rotateY(180deg);
            -webkit-transform: rotateY(180deg);
        }

        .cover-back-pattern {
            width: 82%;
            height: 85%;
            border: 1px solid rgba(180, 150, 100, 0.3);
            border-radius: 4px;
            background: repeating-conic-gradient(rgba(160, 130, 80, 0.06) 0% 25%, transparent 0% 50%) 0 0 / 22px 22px;
        }

        .page-edges-closed {
            position: absolute;
            right: 0;
            top: 4px;
            bottom: 4px;
            width: 14px;
            z-index: 29;
            pointer-events: none;
            border-radius: 0 10px 10px 0;
            background: repeating-linear-gradient(to bottom,
                    #f5ead5 0px,
                    #e8dcc0 1px,
                    #d5c8aa 2px,
                    #e5d8b8 3px,
                    #efe3c8 4px,
                    #d8cbaa 5px);
            box-shadow:
                -1px 0 3px rgba(0, 0, 0, 0.4),
                inset 1px 0 2px rgba(255, 255, 240, 0.4);
            opacity: 0.85;
        }

        .spine-edge {
            position: absolute;
            left: 0;
            top: 0;
            bottom: 0;
            width: var(--spine-width);
            z-index: 32;
            background: linear-gradient(90deg,
                    #0c0604 0%,
                    #1a0e08 40%,
                    #2a1a10 60%,
                    #150a06 100%);
            border-radius: 4px 0 0 4px;
            box-shadow:
                inset 0 0 6px rgba(0, 0, 0, 0.8),
                2px 0 8px rgba(0, 0, 0, 0.6);
            pointer-events: none;
        }

        /* ============================================
           TAP TO OPEN TEXT
           ============================================ */
        .tap-hint {
            position: fixed;
            bottom: 42px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 50;
            font-family: 'Caveat', cursive;
            font-size: 15px;
            color: rgba(220, 190, 150, 0.7);
            text-shadow: 0 1px 3px rgba(0, 0, 0, 0.7);
            pointer-events: none;
            transition: opacity 0.8s ease;
            letter-spacing: 0.5px;
        }
        .tap-hint.hidden {
            opacity: 0;
        }

        /* ============================================
           BOOK PAGES CONTAINER (inside the book)
           ============================================ */
        .pages-container {
            position: absolute;
            inset: 4px 6px 8px 8px;
            z-index: 10;
            transform-style: preserve-3d;
            -webkit-transform-style: preserve-3d;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.4s ease 0.3s;
        }
        .pages-container.visible {
            opacity: 1;
            pointer-events: auto;
        }

        /* ============================================
           INDIVIDUAL SPREAD
           ============================================ */
        .spread {
            position: absolute;
            inset: 0;
            display: flex;
            z-index: 1;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.3s ease;
        }
        .spread.active {
            opacity: 1;
            pointer-events: auto;
            z-index: 5;
        }
        .spread.underneath {
            opacity: 1;
            pointer-events: none;
            z-index: 2;
        }

        .page-left,
        .page-right {
            position: relative;
            width: 50%;
            height: 100%;
            overflow: hidden;
            background: var(--paper-cream);
            display: flex;
            flex-direction: column;
            padding: 22px 18px;
            pointer-events: auto;
        }

        .page-left {
            border-radius: 2px 0 0 2px;
            box-shadow:
                inset -6px 0 12px rgba(0, 0, 0, 0.12),
                inset -2px 0 4px rgba(0, 0, 0, 0.08),
                0 0 0 1px rgba(180, 155, 115, 0.2);
            border-right: 1px solid rgba(150, 120, 80, 0.25);
        }

        .page-right {
            border-radius: 0 2px 2px 0;
            box-shadow:
                inset 6px 0 12px rgba(0, 0, 0, 0.1),
                inset 2px 0 4px rgba(0, 0, 0, 0.06),
                0 0 0 1px rgba(180, 155, 115, 0.2);
            border-left: 1px solid rgba(150, 120, 80, 0.2);
        }

        .page-left::before,
        .page-right::before {
            content: '';
            position: absolute;
            inset: 0;
            background:
                repeating-linear-gradient(0deg,
                    rgba(0, 0, 0, 0.015) 0px,
                    rgba(0, 0, 0, 0.01) 2px,
                    rgba(255, 255, 255, 0.02) 4px,
                    rgba(0, 0, 0, 0.012) 6px),
                radial-gradient(ellipse at 50% 50%, rgba(255, 255, 250, 0.25) 0%, transparent 70%);
            pointer-events: none;
            border-radius: inherit;
        }

        /* ============================================
           FLIP PAGE (for page-turn animation)
           ============================================ */
        .flip-page {
            position: absolute;
            top: 4px;
            right: 6px;
            width: calc(50% - 6px);
            height: calc(100% - 12px);
            z-index: 20;
            transform-style: preserve-3d;
            -webkit-transform-style: preserve-3d;
            transform-origin: left center;
            -webkit-transform-origin: left center;
            pointer-events: none;
            transition: transform var(--turn-duration) var(--turn-ease);
            will-change: transform;
        }

        .flip-page.forward {
            transform: rotateY(-178deg);
            -webkit-transform: rotateY(-178deg);
        }
        .flip-page.backward {
            transform: rotateY(2deg);
            -webkit-transform: rotateY(2deg);
        }

        .flip-face {
            position: absolute;
            inset: 0;
            backface-visibility: hidden;
            -webkit-backface-visibility: hidden;
            overflow: hidden;
            background: var(--paper-cream);
            display: flex;
            flex-direction: column;
            padding: 22px 18px;
            border-radius: 2px;
        }

        .flip-face.front {
            box-shadow:
                inset -6px 0 12px rgba(0, 0, 0, 0.1),
                inset -2px 0 4px rgba(0, 0, 0, 0.06),
                0 0 0 1px rgba(180, 155, 115, 0.2);
        }
        .flip-face.back {
            transform: rotateY(180deg);
            -webkit-transform: rotateY(180deg);
            box-shadow:
                inset 6px 0 12px rgba(0, 0, 0, 0.1),
                inset 2px 0 4px rgba(0, 0, 0, 0.06),
                0 0 0 1px rgba(180, 155, 115, 0.2);
        }

        .flip-face::before {
            content: '';
            position: absolute;
            inset: 0;
            background:
                repeating-linear-gradient(0deg,
                    rgba(0, 0, 0, 0.015) 0px,
                    rgba(0, 0, 0, 0.01) 2px,
                    rgba(255, 255, 255, 0.02) 4px,
                    rgba(0, 0, 0, 0.012) 6px),
                radial-gradient(ellipse at 50% 50%, rgba(255, 255, 250, 0.2) 0%, transparent 70%);
            pointer-events: none;
            border-radius: 2px;
        }

        .page-turn-shadow {
            position: absolute;
            inset: 0;
            z-index: 15;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.2s ease;
            background: radial-gradient(ellipse at 50% 55%, rgba(0, 0, 0, 0.35) 0%, rgba(0, 0, 0, 0.15) 45%, transparent 70%);
        }
        .page-turn-shadow.active {
            opacity: 1;
        }

        /* ============================================
           PAGE CONTENT STYLES
           ============================================ */
        .handwritten {
            font-family: 'Caveat', cursive;
            color: var(--ink-dark);
            line-height: 1.5;
            font-weight: 500;
            text-shadow: 0.5px 0.5px 0 rgba(0, 0, 0, 0.08);
        }

        .handwritten-sm {
            font-size: clamp(12px, 3.2vw, 15px);
        }
        .handwritten-md {
            font-size: clamp(14px, 3.6vw, 17px);
        }
        .handwritten-lg {
            font-size: clamp(16px, 4vw, 20px);
        }
        .handwritten-xl {
            font-size: clamp(20px, 5vw, 26px);
        }
        .handwritten-xxl {
            font-size: clamp(24px, 6vw, 32px);
        }

        .heading-serif {
            font-family: 'Playfair Display', serif;
            font-weight: 600;
            color: #3d2a1a;
            letter-spacing: 0.5px;
            font-size: clamp(18px, 4.5vw, 24px);
            text-shadow: 0 1px 2px rgba(0, 0, 0, 0.08);
        }

        .heading-script {
            font-family: 'Dancing Script', cursive;
            font-weight: 600;
            color: #4a3222;
            font-size: clamp(20px, 5vw, 28px);
            text-shadow: 0 1px 2px rgba(0, 0, 0, 0.06);
        }

        .page-center-content {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            height: 100%;
            gap: 8px;
        }

        .page-top-content {
            display: flex;
            flex-direction: column;
            gap: 6px;
            height: 100%;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
        }
        .page-top-content::-webkit-scrollbar {
            width: 2px;
        }
        .page-top-content::-webkit-scrollbar-track {
            background: transparent;
        }
        .page-top-content::-webkit-scrollbar-thumb {
            background: rgba(120, 90, 60, 0.3);
            border-radius: 2px;
        }

        .spacer {
            flex-grow: 1;
        }

        /* ============================================
           SMALL HEARTS & DECORATIVE ELEMENTS
           ============================================ */
        .tiny-heart {
            display: inline-block;
            color: #c4a0a0;
            font-size: 0.8em;
            position: relative;
            animation: gentlePulse 3s infinite ease-in-out;
        }

        @keyframes gentlePulse {
            0%,
            100% {
                transform: scale(1);
                opacity: 0.7;
            }
            50% {
                transform: scale(1.1);
                opacity: 1;
            }

                currentSpread = index;

            // ============================================
            // PAGE TURNING — FORWARD (right to left)
            // ============================================
            function turnPageForward() {
                if (isTurning || !bookOpen) return;
                if (currentSpread >= TOTAL_SPREADS - 1) return;

                isTurning = true;
                canInteract = false;

                const fromSpread = currentSpread;
                const toSpread = fromSpread + 1;
                const fromData = spreads[fromSpread];
                const toData = spreads[toSpread];

                // Prepare flip page
                flipPage.style.display = 'block';
                flipPage.style.transform = 'rotateY(0deg)';
                flipPage.style.transition = 'none';
                flipFront.innerHTML =
                    `<div class="page-right" style="width:100%;height:100%;padding:22px 18px;border-radius:2px;">${fromData.right}</div>`;
                flipBack.innerHTML =
                    `<div class="page-left" style="width:100%;height:100%;padding:22px 18px;border-radius:2px;">${toData.left}</div>`;
                flipPage.classList.remove('forward', 'backward');

                // Force reflow
                void flipPage.offsetWidth;

                // Enable transition and animate
                flipPage.style.transition = 'transform ' + getComputedStyle(document.documentElement).getPropertyValue(
                    '--turn-duration').trim() + ' ' + getComputedStyle(document.documentElement).getPropertyValue(
                    '--turn-ease').trim();
                flipPage.style.transform = 'rotateY(-178deg)';
                flipPage.classList.add('forward');

                // Show shadow
                pageTurnShadow.classList.add('active');
                pageTurnShadow.style.opacity = '1';

                // Play sound
                playPageTurnSound(PAGE_TURN_VOLUME);

                // Also show the next spread's right page underneath
                const allSpreads = document.querySelectorAll('.spread');
                allSpreads.forEach((spread, i) => {
                    if (i === toSpread) {
                        spread.classList.add('underneath');
                        spread.classList.remove('active');
                    } else if (i === fromSpread) {
                        spread.classList.remove('underneath');
                        spread.classList.add('active');
                    }
                });

                // After animation
                const duration = 750; // matches CSS variable
                setTimeout(() => {
                    // Move to the next spread
                    showSpread(toSpread);

                    // Reset flip page
                    flipPage.style.display = 'none';
                    flipPage.classList.remove('forward', 'backward');
                    pageTurnShadow.classList.remove('active');
                    pageTurnShadow.style.opacity = '0';

                    isTurning = false;
                    canInteract = true;
                }, duration + 50);
            }

            // ============================================
            // PAGE TURNING — BACKWARD (left to right)
            // ============================================
            function turnPageBackward() {
                if (isTurning || !bookOpen) return;
                if (currentSpread <= 0) return;

                isTurning = true;
                canInteract = false;

                const fromSpread = currentSpread;
                const toSpread = fromSpread - 1;
                const fromData = spreads[fromSpread];
                const toData = spreads[toSpread];

                // Prepare flip page for backward turn
                flipPage.style.display = 'block';
                flipPage.style.transform = 'rotateY(-178deg)';
                flipPage.style.transition = 'none';
                flipBack.innerHTML =
                    `<div class="page-left" style="width:100%;height:100%;padding:22px 18px;border-radius:2px;">${fromData.left}</div>`;
                flipFront.innerHTML =
                    `<div class="page-right" style="width:100%;height:100%;padding:22px 18px;border-radius:2px;">${toData.right}</div>`;
                flipPage.classList.remove('forward', 'backward');

                // Force reflow
                void flipPage.offsetWidth;

                // Enable transition and animate backward
                flipPage.style.transition = 'transform ' + getComputedStyle(document.documentElement).getPropertyValue(
                    '--turn-duration').trim() + ' ' + getComputedStyle(document.documentElement).getPropertyValue(
                    '--turn-ease').trim();
                flipPage.style.transform = 'rotateY(2deg)';
                flipPage.classList.add('backward');

                // Show shadow
                pageTurnShadow.classList.add('active');
                pageTurnShadow.style.opacity = '1';

                // Play sound
                playPageTurnSound(PAGE_TURN_VOLUME * 0.85);

                // Show previous spread's right page underneath
                const allSpreads = document.querySelectorAll('.spread');
                allSpreads.forEach((spread, i) => {
                    if (i === toSpread) {
                        spread.classList.add('underneath');
                        spread.classList.remove('active');
                    } else if (i === fromSpread) {
                        spread.classList.remove('underneath');
                        spread.classList.add('active');
                    }
                });

                const duration = 750;
                setTimeout(() => {
                    showSpread(toSpread);
                    flipPage.style.display = 'none';
                    flipPage.classList.remove('forward', 'backward');
                    pageTurnShadow.classList.remove('active');
                    pageTurnShadow.style.opacity = '0';

                    isTurning = false;
                    canInteract = true;
                }, duration + 50);
            }

            // ============================================
            // TOUCH HANDLING
            // ============================================
            let touchStartX = 0;
            let touchStartY = 0;
            let touchStartTime = 0;
            let isSwiping = false;

            function handleTouchStart(e) {
                if (!bookOpen || isTurning) return;
                const touch = e.touches[0];
                touchStartX = touch.clientX;
                touchStartY = touch.clientY;
                touchStartTime = Date.now();
                isSwiping = false;
            }

            function handleTouchEnd(e) {
                if (!bookOpen || isTurning) return;
                const touch = e.changedTouches[0];
                const deltaX = touch.clientX - touchStartX;
                const deltaY = touch.clientY - touchStartY;
                const deltaTime = Date.now() - touchStartTime;

                const absDeltaX = Math.abs(deltaX);
                const absDeltaY = Math.abs(deltaY);

                const stageRect = document.getElementById('bookStage').getBoundingClientRect();
                const centerX = stageRect.left + stageRect.width / 2;

                if (absDeltaX < 20 && absDeltaY < 20 && deltaTime < 400) {
                    // TAP
                    if (touch.clientX > centerX) {
                        turnPageForward();
                    } else {
                        turnPageBackward();
                    }
                } else if (absDeltaX > 40 && absDeltaX > absDeltaY * 1.5) {
                    if (deltaX < 0) {
                        turnPageForward();
                    } else {
                        turnPageBackward();
                    }
                }
            }

            // ============================================
            // CLICK FALLBACK (for desktop testing)
            // ============================================
            function handleClick(e) {
                if (!bookOpen || isTurning) return;
                if (e.target.closest('.envelope-container') ||
                    e.target.closest('.handwritten-btn') ||
                    e.target.closest('.github-btn') ||
                    e.target.closest('.audio-toggle')) {
                    return;
                }
                const stageRect = document.getElementById('bookStage').getBoundingClientRect();
                const centerX = stageRect.left + stageRect.width / 2;
                if (e.clientX > centerX) {
                    turnPageForward();
                } else {
                    turnPageBackward();
                }
            }

            // ============================================
            // AUDIO SYSTEM (Web Audio API + HTML5 Audio)
            // ============================================
            function initAudio() {
                if (audioContext) return;
                try {
                    audioContext = new(window.AudioContext || window.webkitAudioContext)();
                } catch (e) {
                    console.warn('Web Audio API not available');
                    audioContext = null;
                }
            }

            function playPageTurnSound(volume) {
                if (!audioEnabled || !audioContext) return;
                try {
                    const bufferSize = audioContext.sampleRate * 0.12;
                    const buffer = audioContext.createBuffer(1, bufferSize, audioContext.sampleRate);
                    const data = buffer.getChannelData(0);
                    for (let i = 0; i < bufferSize; i++) {
                        const t = i / bufferSize;
                        const envelope = Math.sin(Math.PI * t);
                        data[i] = (Math.random() * 2 - 1) * envelope * 0.6;
                    }
                    const source = audioContext.createBufferSource();
                    source.buffer = buffer;
                    const filter = audioContext.createBiquadFilter();
                    filter.type = 'bandpass';
                    filter.frequency.setValueAtTime(1800, audioContext.currentTime);
                    filter.Q.value = 0.7;
                    const gain = audioContext.createGain();
                    gain.gain.setValueAtTime(volume * 0.8, audioContext.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.001, audioContext.currentTime + 0.12);
                    source.connect(filter);
                    filter.connect(gain);
                    gain.connect(audioContext.destination);
                    source.start(0);
                    source.stop(audioContext.currentTime + 0.13);
                } catch (e) { /* silent fail */ }
            }

            // ─── MUSIC: URL-based or synthetic fallback ───
            function startMusic() {
                if (!audioEnabled || musicStarted) return;
                if (!ENABLE_MUSIC) return;

                // If the user provided a real music URL, use HTML5 Audio
                if (MUSIC_URL && MUSIC_URL !== 'PASTE_YOUR_MUSIC_URL_HERE') {
                    try {
                        musicAudioElement = new Audio(MUSIC_URL);
                        musicAudioElement.loop = true;
                        musicAudioElement.volume = MUSIC_VOLUME;
                        musicAudioElement.play().then(() => {
                            musicStarted = true;
                            console.log('🎵 Playing music from URL:', MUSIC_URL);
                        }).catch((err) => {
                            console.warn('Could not play music from URL, falling back to synthetic tones:', err);
                            musicAudioElement = null;
                            startSyntheticMusic();
                        });
                        return;
                    } catch (e) {
                        console.warn('Error creating Audio element for URL, falling back to synthetic:', e);
                        musicAudioElement = null;
                    }
                }

                // Fallback: synthetic ambient tones
                startSyntheticMusic();
            }

            function startSyntheticMusic() {
                if (!audioContext || musicStarted) return;
                try {
                    musicStarted = true;
                    const masterGain = audioContext.createGain();
                    masterGain.gain.setValueAtTime(0.0001, audioContext.currentTime);
                    masterGain.gain.exponentialRampToValueAtTime(MUSIC_VOLUME, audioContext.currentTime + 2);
                    masterGain.connect(audioContext.destination);

                    const osc1 = audioContext.createOscillator();
                    osc1.type = 'sine';
                    osc1.frequency.setValueAtTime(174, audioContext.currentTime);
                    const osc1Gain = audioContext.createGain();
                    osc1Gain.gain.setValueAtTime(0.3, audioContext.currentTime);
                    osc1.connect(osc1Gain);
                    osc1Gain.connect(masterGain);
                    osc1.start();

                    const osc2 = audioContext.createOscillator();
                    osc2.type = 'sine';
                    osc2.frequency.setValueAtTime(220, audioContext.currentTime);
                    const osc2Gain = audioContext.createGain();
                    osc2Gain.gain.setValueAtTime(0.15, audioContext.currentTime);
                    osc2.connect(osc2Gain);
                    osc2Gain.connect(masterGain);
                    osc2.start();

                    const osc3 = audioContext.createOscillator();
                    osc3.type = 'sine';
                    osc3.frequency.setValueAtTime(261, audioContext.currentTime);
                    const osc3Gain = audioContext.createGain();
                    osc3Gain.gain.setValueAtTime(0.06, audioContext.currentTime);
                    osc3.connect(osc3Gain);
                    osc3Gain.connect(masterGain);
                    osc3.start();

                    musicNodes = { masterGain, osc1, osc2, osc3, osc1Gain, osc2Gain, osc3Gain };
                    console.log('🎵 Playing synthetic ambient music');
                } catch (e) {
                    musicStarted = false;
                }
            }

            function stopMusic() {
                // Stop URL-based audio
                if (musicAudioElement) {
                    try {
                        musicAudioElement.pause();
                        musicAudioElement.currentTime = 0;
                        musicAudioElement = null;
                    } catch (e) { /* ignore */ }
                }
                // Stop synthetic audio
                if (musicNodes) {
                    try {
                        const { masterGain, osc1, osc2, osc3, osc1Gain, osc2Gain, osc3Gain } = musicNodes;
                        masterGain.gain.exponentialRampToValueAtTime(0.0001, audioContext.currentTime + 0.5);
                        setTimeout(() => {
                            try {
                                osc1.stop();
                                osc2.stop();
                                osc3.stop();
                                osc1Gain.disconnect();
                                osc2Gain.disconnect();
                                osc3Gain.disconnect();
                                masterGain.disconnect();
                            } catch (e) {}
                            musicNodes = null;
                            musicStarted = false;
                        }, 600);
                    } catch (e) {
                        musicNodes = null;
                        musicStarted = false;
                    }
                }
                musicStarted = false;
            }

            // Audio toggle
            audioToggle.addEventListener('click', function() {
                initAudio();
                if (!audioContext) return;
                audioEnabled = !audioEnabled;
                audioIcon.textContent = audioEnabled ? '🔊' : '🔇';
                if (audioEnabled) {
                    audioContext.resume().then(() => {
                        startMusic();
                    }).catch(() => {});
                } else {
                    stopMusic();
                }
            });

            function init() {

                currentSpread = 0;
                isTurning = false;

                bookCoverClosed.style.display = 'block';
                pageEdgesClosed.style.opacity = '0.85';
                tapHint.classList.remove('hidden');

                generateDust();

                console.log('📖 "For You" — A Little Book of Beautiful Things');
                console.log('✨ Tap the book to open it.');
                console.log('🔗 GitHub link:', GITHUB_LINK === 'PASTE_YOUR_GITHUB_LINK_HERE' ? 'NOT SET (edit GITHUB_LINK in JS)' :
                    GITHUB_LINK);
                console.log('🎵 Music URL:', MUSIC_URL === 'PASTE_YOUR_MUSIC_URL_HERE' ? 'NOT SET (using synthetic tones)' :
                    MUSIC_URL);
            }

            function handleResize() {
                // The book is centered via flexbox, no manual adjustment needed
            }

            window.addEventListener('resize', handleResize);
            window.addEventListener('orientationchange', handleResize);

            init();

            // Expose for debugging
            window.__bookApp = {
                openBook,
                turnPageForward,
                turnPageBackward,
                showSpread,
                currentSpread: () => currentSpread,
                bookOpen: () => bookOpen,
                GITHUB_LINK,
                MUSIC_URL,
            };

        })();
    </script>
</body>
</html>
